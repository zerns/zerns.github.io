<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Kilaw</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f3d2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .center { text-align: center; color: #fff; }

    .label {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #7ecbaa;
      margin-bottom: 24px;
      opacity: 0;
      animation: simpleFade 1s ease forwards;
      animation-delay: 1.6s;
    }

    h1 {
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      color: #fff;
      opacity: 0;
      animation: simpleFade 1s ease forwards;
      animation-delay: 0.2s;
    }

    h1 .char {
      display: inline-block;
      transition: transform 0.3s ease, color 0.2s ease;
      cursor: default;
    }

    h1 .char.space { width: 0.3em; }

    h1 .char:hover {
      transform: translateY(-12px);
      color: #7ecbaa;
    }

    .char-k {
      display: inline-block;
      position: relative;
      transition: transform 0.3s ease, color 0.2s ease;
      cursor: default;
    }

    .char-k:hover {
      transform: translateY(-12px);
      color: #7ecbaa;
    }

    .kilaw-img {
      position: absolute;
      top: 100%;
      left: 50%;
      width: 90px;
      height: auto;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(-32px) scale(0.92);
      transition: opacity 0.3s ease, transform 0.3s ease;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    }

    .char-k:hover .kilaw-img {
      opacity: 1;
      transform: translateX(-50%) translateY(-20px) scale(1);
    }

    .divider {
      height: 2px;
      background: #7ecbaa;
      margin: 28px auto 0;
      width: 0;
      animation: drawLine 0.7s ease forwards;
      animation-delay: 1s;
    }

    @keyframes simpleFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes drawLine {
      from { width: 0; }
      to   { width: 48px; }
    }
  </style>
  <script>
    function placeKilawImage() {
      const positions = [
        { letter: 'P', index: 0 },
        { letter: 'r', index: 1 },
        { letter: 'o', index: 2 },
        { letter: 'e', index: 4 },
        { letter: 'c', index: 5 },
        { letter: 't', index: 6 },
        { letter: 'K', index: 8 },
        { letter: 'i', index: 9 },
        { letter: 'l', index: 10 },
        { letter: 'a', index: 11 },
        { letter: 'w', index: 12 }
      ];

      const randomPos = positions[Math.floor(Math.random() * positions.length)];
      const chars = document.querySelectorAll('h1 .char, h1 .char-k');

      chars.forEach((char, i) => {
        if (i === randomPos.index) {
          if (!char.classList.contains('char-k')) {
            char.classList.add('char-k');
            const img = document.createElement('img');
            img.className = 'kilaw-img';
            img.src = 'assets/kilaw.png';
            img.alt = '';
            char.appendChild(img);
          }
        } else {
          const img = char.querySelector('.kilaw-img');
          if (img) img.remove();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', placeKilawImage);
  </script>
</head>
<body>

  <div class="center">
    <p class="label">Coming Soon</p>
    <h1>
      <span class="char">P</span><span class="char">r</span><span class="char">o</span><span class="char">j</span><span class="char">e</span><span class="char">c</span><span class="char">t</span><span class="char space"> </span><span class="char">K</span><span class="char">i</span><span class="char">l</span><span class="char">a</span><span class="char">w</span>
    </h1>
    <div class="divider"></div>
  </div>

</body>
</html>
